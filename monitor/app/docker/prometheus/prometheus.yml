global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      # node-exporter uses host networking and listens on the fygo-monitor bridge gateway.
      - targets: ["172.31.213.1:9100"]
        labels:
          instance: fygo-nas

  # Only resolves when the "containers" profile is enabled.
  # When cAdvisor is off this target shows as down in Prometheus, which is harmless.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
